[project]
name = "pep-440-version-parser"
version = "0.1.1"
description = "Parses PEP 440 version strings including epochs, pre-releases, post-releases, and local version segments."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
